name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Built-in self-test
        run: python -m cci selftest
      - name: Smoke — sample, report, json, dashboard
        run: |
          python -m cci sample --out examples/sample-usage.jsonl
          python -m cci report --path examples/sample-usage.jsonl
          python -m cci json --path examples/sample-usage.jsonl --compact > report.json
          python -m cci dashboard --path examples/sample-usage.jsonl --out cci-dashboard.html
      - name: Pytest
        run: python -m pytest -q

  dashboard-smoke:
    name: dashboard headless validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -e .
      - name: Generate + validate dashboard JSON
        run: |
          python -m cci sample --out examples/sample-usage.jsonl
          python -m cci dashboard --path examples/sample-usage.jsonl --out cci-dashboard.html
          node scripts/validate_dashboard.js cci-dashboard.html
